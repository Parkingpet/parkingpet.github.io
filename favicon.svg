<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Parkingpet neon favicon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#001622" />
      <stop offset="1" stop-color="#002B3A" />
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#33F0E0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00A3FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="10" fill="url(#bg)" />

  <!-- subtle grid (inspired by provided images) -->
  <g stroke="#003B56" stroke-width="0.6">
    <defs>
      <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
        <path d="M8 0 L0 0 0 8" fill="none" stroke="#01384A" stroke-width="0.6"/>
      </pattern>
    </defs>
    <rect x="2" y="4" width="60" height="56" fill="url(#grid)" opacity="0.55" rx="6"/>
  </g>

  <!-- blocky 'P' (pixel style) made from rectangles to match neon block lettering -->
  <g fill="url(#glow)" filter="url(#softGlow)" stroke="#6FEFF0" stroke-width="0.4">
    <!-- left stem -->
    <rect x="10" y="12" width="8" height="40" rx="1" />
    <!-- upper bowl top row -->
    <rect x="18" y="12" width="14" height="8" rx="1" />
    <!-- upper bowl middle -->
    <rect x="18" y="20" width="14" height="8" rx="1" />
    <!-- small connector to stem (to make P shape) -->
    <rect x="18" y="28" width="6" height="8" rx="1" />
    <!-- inner cutout (dark) to give grid/inset look -->
    <rect x="20" y="16" width="10" height="8" fill="#00222B" />
  </g>

  <!-- paw motif in upper-right made of small squares to reference pet element -->
  <g fill="#9FFCF0" filter="url(#softGlow)">
    <rect x="44" y="10" width="6" height="8" rx="1" />
    <rect x="38" y="6" width="4" height="4" rx="0.8" />
    <rect x="44" y="4" width="4" height="4" rx="0.8" />
    <rect x="50" y="6" width="4" height="4" rx="0.8" />
    <rect x="44" y="14" width="4" height="4" rx="0.8" />
  </g>

  <!-- fine highlights to mimic the blueprint look from images -->
  <g stroke="#66EDE0" stroke-width="0.8" fill="none" opacity="0.25">
    <path d="M12 14 L30 14" />
    <path d="M12 26 L26 26" />
    <path d="M12 38 L22 38" />
  </g>

</svg>
