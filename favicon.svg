<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Parkingpet favicon">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00B4A3" />
      <stop offset="1" stop-color="#0077B6" />
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="64" height="64" rx="12" fill="url(#g)" />

  <!-- Big 'P' for Parkingpet -->
  <text x="10" y="46" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="36" fill="#ffffff">P</text>

  <!-- Paw mark (pet) on the upper right to combine parking + pet identity -->
  <g fill="#ffffff">
    <!-- main pad -->
    <ellipse cx="52" cy="20" rx="6" ry="8" />
    <!-- toes -->
    <circle cx="46" cy="12" r="3" />
    <circle cx="52" cy="8" r="3" />
    <circle cx="58" cy="12" r="3" />
    <circle cx="52" cy="16" r="3" />
  </g>

</svg>
