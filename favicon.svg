<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Parkingpet neon 'M' favicon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#001419" />
      <stop offset="1" stop-color="#001f2b" />
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#46FFF0" />
      <stop offset="1" stop-color="#00A6FF" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="8" fill="url(#bg)" />

  <!-- faint grid -->
  <g opacity="0.45" stroke="#022933" stroke-width="0.6">
    <defs>
      <pattern id="grid2" width="6" height="6" patternUnits="userSpaceOnUse">
        <path d="M6 0 L0 0 0 6" fill="none" stroke="#01343D" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="2" y="4" width="60" height="56" fill="url(#grid2)" rx="6" />
  </g>

  <!-- blocky 'M' built from rectangles to match the uploaded image -->
  <g fill="url(#neon)" filter="url(#glow)" stroke="#7FF7EE" stroke-width="0.6">
    <!-- left column -->
    <rect x="6" y="10" width="8" height="44" rx="1" />
    <!-- left upper diagonal block -->
    <rect x="14" y="10" width="8" height="20" rx="1" transform="skewX(-8)" />
    <!-- center peak column -->
    <rect x="26" y="10" width="8" height="44" rx="1" />
    <!-- right upper diagonal block -->
    <rect x="34" y="10" width="8" height="20" rx="1" transform="skewX(8)" />
    <!-- right column -->
    <rect x="46" y="10" width="8" height="44" rx="1" />
    <!-- horizontal connectors to shape the M more blocky -->
    <rect x="14" y="30" width="12" height="8" rx="1" fill="url(#neon)" />
    <rect x="34" y="30" width="12" height="8" rx="1" fill="url(#neon)" />
  </g>

  <!-- inner cut lines for grid/blueprint look -->
  <g stroke="#80F5EE" stroke-width="0.8" opacity="0.25" fill="none">
    <path d="M8 18 L20 18" />
    <path d="M12 28 L28 28" />
    <path d="M36 18 L52 18" />
    <path d="M36 28 L52 28" />
  </g>

</svg>
