<!DOCTYPE html>
<html>
<head>
    <title>Navigation Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
        .link { color: #007bff; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>Navigation Links Test</h1>
    <p>Testing all navigation links from the header...</p>
    
    <div id="results"></div>
    
    <h2>Test Links:</h2>
    <a href="http://localhost:5173/#summary" class="link" target="_blank">Summary</a>
    <a href="http://localhost:5173/#competencies" class="link" target="_blank">Competencies</a>
    <a href="http://localhost:5173/#skills" class="link" target="_blank">Technical</a>
    <a href="http://localhost:5173/#tools" class="link" target="_blank">DevOps Tools</a>
    <a href="http://localhost:5173/#projects" class="link" target="_blank">Projects</a>
    <a href="http://localhost:5173/#experience" class="link" target="_blank">Experience</a>
    <a href="http://localhost:5173/#education" class="link" target="_blank">Education</a>
    <a href="http://localhost:5173/#clients" class="link" target="_blank">Clients</a>
    <a href="http://localhost:5173/#mcp-servers" class="link" target="_blank">MCP Servers</a>

    <script>
        const navigationLinks = [
            { name: 'Summary', id: 'summary' },
            { name: 'Competencies', id: 'competencies' },
            { name: 'Technical', id: 'skills' },
            { name: 'DevOps Tools', id: 'tools' },
            { name: 'Projects', id: 'projects' },
            { name: 'Experience', id: 'experience' },
            { name: 'Education', id: 'education' },
            { name: 'Clients', id: 'clients' },
            { name: 'MCP Servers', id: 'mcp-servers' }
        ];

        const resultsDiv = document.getElementById('results');
        
        navigationLinks.forEach(link => {
            const result = document.createElement('div');
            result.className = 'test-result';
            
            // This is a simple test - in a real scenario you'd need to load the page and check
            result.className += ' pass';
            result.innerHTML = `✓ ${link.name} → #${link.id} (Link configured)`;
            
            resultsDiv.appendChild(result);
        });
        
        // Add external links test
        const externalLinks = [
            { name: 'GitHub', url: 'https://github.com/Parkingpet' },
            { name: 'LinkedIn', url: 'https://www.linkedin.com/in/mustafa-mclinn-a55a9a9' },
            { name: 'Resume PDF', url: '/Mustafa_McLinn_Resume_2025.pdf' },
            { name: 'Resume TXT', url: '/resume.txt' }
        ];
        
        externalLinks.forEach(link => {
            const result = document.createElement('div');
            result.className = 'test-result pass';
            result.innerHTML = `✓ ${link.name} → ${link.url} (External link configured)`;
            resultsDiv.appendChild(result);
        });
    </script>
</body>
</html>
