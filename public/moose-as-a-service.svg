<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mooseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <g stroke="rgba(56, 189, 248, 0.1)" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    
    <line x1="0" y1="0" x2="0" y2="600"/>
    <line x1="120" y1="0" x2="120" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="840" y1="0" x2="840" y2="600"/>
    <line x1="960" y1="0" x2="960" y2="600"/>
    <line x1="1080" y1="0" x2="1080" y2="600"/>
    <line x1="1200" y1="0" x2="1200" y2="600"/>
  </g>
  
  <!-- Moose illustration -->
  <g transform="translate(600, 300)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="80" ry="100" fill="url(#mooseGradient)" opacity="0.9"/>
    
    <!-- Head -->
    <circle cx="0" cy="-110" r="60" fill="url(#mooseGradient)" opacity="0.9"/>
    
    <!-- Ears -->
    <ellipse cx="-35" cy="-160" rx="20" ry="35" fill="url(#mooseGradient)" opacity="0.9"/>
    <ellipse cx="35" cy="-160" rx="20" ry="35" fill="url(#mooseGradient)" opacity="0.9"/>
    
    <!-- Antlers left -->
    <path d="M -30 -165 Q -60 -200 -70 -240 Q -65 -235 -50 -220" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -30 -165 Q -50 -210 -45 -250" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -30 -165 Q -20 -215 -10 -260" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Antlers right -->
    <path d="M 30 -165 Q 60 -200 70 -240 Q 65 -235 50 -220" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 30 -165 Q 50 -210 45 -250" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 30 -165 Q 20 -215 10 -260" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="-20" cy="-120" r="6" fill="#10b981"/>
    <circle cx="20" cy="-120" r="6" fill="#10b981"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="-100" rx="8" ry="10" fill="#10b981"/>
    
    <!-- Legs -->
    <rect x="-50" y="80" width="20" height="80" rx="10" fill="url(#mooseGradient)" opacity="0.8"/>
    <rect x="-10" y="80" width="20" height="80" rx="10" fill="url(#mooseGradient)" opacity="0.8"/>
    <rect x="30" y="80" width="20" height="80" rx="10" fill="url(#mooseGradient)" opacity="0.8"/>
    <rect x="70" y="80" width="20" height="80" rx="10" fill="url(#mooseGradient)" opacity="0.8"/>
    
    <!-- Hooves -->
    <rect x="-50" y="155" width="20" height="15" rx="3" fill="#10b981"/>
    <rect x="-10" y="155" width="20" height="15" rx="3" fill="#10b981"/>
    <rect x="30" y="155" width="20" height="15" rx="3" fill="#10b981"/>
    <rect x="70" y="155" width="20" height="15" rx="3" fill="#10b981"/>
    
    <!-- Tail -->
    <path d="M 70 20 Q 100 30 110 60" stroke="#38bdf8" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="520" font-family="Inter, Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="-0.02em">
    Moose as a Service
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="560" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#10b981" text-anchor="middle" letter-spacing="0.02em">
    DevOps Infrastructure • Cloud Solutions • Automation
  </text>
</svg>
