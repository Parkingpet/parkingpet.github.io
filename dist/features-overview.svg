<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)" rx="12"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="28" font-weight="600">DevOps Resume Features</text>
  
  <!-- Feature Cards -->
  <!-- Terminal Experience -->
  <rect x="50" y="80" width="220" height="280" fill="url(#cardGradient)" stroke="#38bdf8" stroke-width="1" rx="8"/>
  <text x="160" y="110" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="18" font-weight="600">Terminal Experience</text>
  
  <!-- Terminal Icon -->
  <rect x="130" y="130" width="60" height="40" fill="#0b1220" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <circle cx="140" cy="140" r="2" fill="#10b981"/>
  <circle cx="150" cy="140" r="2" fill="#f59e0b"/>
  <circle cx="160" cy="140" r="2" fill="#ef4444"/>
  <text x="135" y="160" fill="#38bdf8" font-family="monospace" font-size="8">&gt; Loading...</text>
  
  <text x="160" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Authentic CLI boot</text>
  <text x="160" y="220" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Cyberpunk aesthetic</text>
  <text x="160" y="240" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Animated grid</text>
  <text x="160" y="260" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Progress indicators</text>
  
  <!-- DevOps Tools -->
  <rect x="290" y="80" width="220" height="280" fill="url(#cardGradient)" stroke="#38bdf8" stroke-width="1" rx="8"/>
  <text x="400" y="110" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="18" font-weight="600">DevOps Tools</text>
  
  <!-- Tools Icons -->
  <rect x="320" y="130" width="160" height="80" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="4"/>
  <text x="330" y="150" fill="#10b981" font-family="monospace" font-size="10">Base64 | JSON | UUID</text>
  <text x="330" y="165" fill="#f59e0b" font-family="monospace" font-size="10">SHA-256 | Regex | URL</text>
  <text x="330" y="180" fill="#8b5cf6" font-family="monospace" font-size="10">Timestamp | JWT | YAML</text>
  <text x="330" y="195" fill="#38bdf8" font-family="monospace" font-size="10">CLI Commands | Subnet</text>
  
  <text x="400" y="240" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• 15+ Built-in utilities</text>
  <text x="400" y="260" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Real-time processing</text>
  <text x="400" y="280" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Copy to clipboard</text>
  
  <!-- Quick Links -->
  <rect x="530" y="80" width="220" height="280" fill="url(#cardGradient)" stroke="#38bdf8" stroke-width="1" rx="8"/>
  <text x="640" y="110" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="18" font-weight="600">Quick Links</text>
  
  <!-- Cloud Icons -->
  <rect x="560" y="130" width="50" height="30" fill="#FF9900" rx="4"/>
  <text x="585" y="150" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10" font-weight="600">AWS</text>
  
  <rect x="620" y="130" width="50" height="30" fill="#0078d4" rx="4"/>
  <text x="645" y="150" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="600">Azure</text>
  
  <rect x="680" y="130" width="50" height="30" fill="#4285f4" rx="4"/>
  <text x="705" y="150" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10" font-weight="600">GCP</text>
  
  <text x="640" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Collapsible sections</text>
  <text x="640" y="220" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Cloud platforms</text>
  <text x="640" y="240" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Direct console links</text>
  <text x="640" y="260" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">• Documentation</text>
</svg>