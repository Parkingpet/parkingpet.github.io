<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bgGradient)" rx="12"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="24" font-weight="600">Performance Metrics</text>

  <!-- Metrics -->
  <!-- Build Time -->
  <text x="50" y="70" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="500">Build Time</text>
  <rect x="50" y="80" width="200" height="20" fill="#1e293b" stroke="#23314d" stroke-width="1" rx="10"/>
  <rect x="50" y="80" width="20" height="20" fill="url(#barGradient)" rx="10"/>
  <text x="260" y="95" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="600">~1 second</text>

  <!-- Bundle Size -->
  <text x="50" y="130" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="500">Bundle Size</text>
  <rect x="50" y="140" width="200" height="20" fill="#1e293b" stroke="#23314d" stroke-width="1" rx="10"/>
  <rect x="50" y="140" width="36" height="20" fill="url(#barGradient)" rx="10"/>
  <text x="260" y="155" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="600">&lt;180KB gzipped</text>

  <!-- Load Time -->
  <text x="50" y="190" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="500">Load Time (3G)</text>
  <rect x="50" y="200" width="200" height="20" fill="#1e293b" stroke="#23314d" stroke-width="1" rx="10"/>
  <rect x="50" y="200" width="20" height="20" fill="url(#barGradient)" rx="10"/>
  <text x="260" y="215" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="600">&lt;1 second</text>

  <!-- Lighthouse Score -->
  <text x="350" y="70" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="500">Lighthouse Score</text>
  <circle cx="450" cy="120" r="40" fill="none" stroke="#23314d" stroke-width="4"/>
  <circle cx="450" cy="120" r="40" fill="none" stroke="#10b981" stroke-width="4"
          stroke-dasharray="238" stroke-dashoffset="24" transform="rotate(-90 450 120)"/>
  <text x="450" y="130" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="24" font-weight="700">95+</text>

  <!-- Performance Indicators -->
  <text x="50" y="250" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">First Contentful Paint: &lt;0.8s</text>
  <text x="50" y="270" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Time to Interactive: &lt;1.2s</text>

  <text x="350" y="250" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Optimized with Vite</text>
  <text x="350" y="270" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Tree shaking &amp; code splitting</text>
</svg>