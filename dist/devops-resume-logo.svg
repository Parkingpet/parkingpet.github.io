<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="400" height="200">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  
  <!-- Terminal window -->
  <rect x="20" y="20" width="160" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Terminal header -->
  <rect x="20" y="20" width="160" height="20" fill="#1e40af" rx="8 8 0 0"/>
  <circle cx="30" cy="30" r="4" fill="#ef4444"/>
  <circle cx="45" cy="30" r="4" fill="#fbbf24"/>
  <circle cx="60" cy="30" r="4" fill="#10b981"/>
  
  <!-- Terminal content -->
  <text x="30" y="50" font-family="monospace" font-size="10" fill="#38bdf8">$ devops resume --show-skills</text>
  <text x="30" y="70" font-family="monospace" font-size="10" fill="#38bdf8">> Infrastructure as Code</text>
  <text x="30" y="85" font-family="monospace" font-size="10" fill="#38bdf8">> CI/CD Pipelines</text>
  <text x="30" y="100" font-family="monospace" font-size="10" fill="#38bdf8">> Cloud Architecture</text>
  
  <!-- DevOps tools icons -->
  <circle cx="160" cy="50" r="8" fill="#38bdf8" opacity="0.8"/>
  <circle cx="180" cy="50" r="8" fill="#10b981" opacity="0.8"/>
  <circle cx="170" cy="70" r="8" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Title -->
  <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">DevOps Resume</text>
  <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Infrastructure • Automation • Cloud</text>
  
  <!-- Decorative elements -->
  <line x1="50" y1="160" x2="150" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="100" cy="160" r="4" fill="#38bdf8"/>
</svg>