<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)" rx="12"/>

  <!-- Browser Frame -->
  <rect x="20" y="20" width="760" height="460" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>

  <!-- Browser Header -->
  <rect x="20" y="20" width="760" height="40" fill="#0f172a" rx="8"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#10b981"/>

  <!-- URL Bar -->
  <rect x="120" y="30" width="500" height="20" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="10"/>
  <text x="130" y="43" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">https://parkingpet.github.io</text>

  <!-- Main Content -->
  <rect x="40" y="80" width="720" height="380" fill="url(#toolGradient)" stroke="#23314d" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="400" y="110" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="24" font-weight="600">DevOps Tools &amp; Quick Links</text>

  <!-- Tabs -->
  <rect x="60" y="130" width="80" height="30" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" rx="6"/>
  <text x="100" y="150" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Base64</text>

  <rect x="150" y="130" width="80" height="30" fill="#111c33" stroke="#23314d" stroke-width="1" rx="6"/>
  <text x="190" y="150" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="500">JSON</text>

  <rect x="240" y="130" width="80" height="30" fill="#111c33" stroke="#23314d" stroke-width="1" rx="6"/>
  <text x="280" y="150" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="500">SHA-256</text>

  <rect x="330" y="130" width="80" height="30" fill="#111c33" stroke="#23314d" stroke-width="1" rx="6"/>
  <text x="370" y="150" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="500">UUID</text>

  <!-- Tool Content -->
  <text x="70" y="190" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="600">Base64 Tool</text>

  <!-- Input Area -->
  <rect x="70" y="200" width="660" height="60" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="6"/>
  <text x="80" y="220" fill="#e2e8f0" font-family="monospace" font-size="12">Hello DevOps World!</text>

  <!-- Buttons -->
  <rect x="70" y="280" width="80" height="30" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" rx="6"/>
  <text x="110" y="300" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Encode</text>

  <rect x="160" y="280" width="80" height="30" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" rx="6"/>
  <text x="200" y="300" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Decode</text>

  <!-- Output Area -->
  <rect x="70" y="330" width="660" height="60" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="6"/>
  <text x="80" y="350" fill="#10b981" font-family="monospace" font-size="12">SGVsbG8gRGV2T3BzIFdvcmxkIQ==</text>

  <!-- Quick Links Section -->
  <text x="70" y="420" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="600">Quick Links</text>

  <!-- Link Cards -->
  <rect x="70" y="430" width="200" height="20" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="4"/>
  <text x="80" y="445" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">🌐 View Live Site</text>

  <rect x="280" y="430" width="200" height="20" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="4"/>
  <text x="290" y="445" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">☁️ Azure Portal</text>

  <rect x="490" y="430" width="200" height="20" fill="#0b1220" stroke="#23314d" stroke-width="1" rx="4"/>
  <text x="500" y="445" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">📦 AWS Console</text>
</svg>