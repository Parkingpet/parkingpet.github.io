<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Terminal window frame -->
  <g>
    <!-- Outer border -->
    <rect x="50" y="50" width="300" height="300" rx="12" fill="none" stroke="url(#logoGradient)" stroke-width="3"/>
    
    <!-- Title bar -->
    <rect x="50" y="50" width="300" height="40" rx="12" fill="rgba(56, 189, 248, 0.1)" stroke="url(#logoGradient)" stroke-width="3"/>
    
    <!-- Window controls -->
    <circle cx="75" cy="70" r="4" fill="#f59e0b"/>
    <circle cx="95" cy="70" r="4" fill="#10b981"/>
    <circle cx="115" cy="70" r="4" fill="#38bdf8"/>
    
    <!-- Title text -->
    <text x="200" y="72" font-family="Fira Code, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">devops@terminal</text>
    
    <!-- Terminal content area -->
    <rect x="50" y="90" width="300" height="260" fill="rgba(15, 23, 42, 0.8)"/>
    
    <!-- Command prompt line 1 -->
    <text x="70" y="130" font-family="Fira Code, monospace" font-size="14" fill="#38bdf8">$ deploy</text>
    
    <!-- Animated lines -->
    <line x1="70" y1="150" x2="320" y2="150" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <line x1="70" y1="170" x2="280" y2="170" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <line x1="70" y1="190" x2="300" y2="190" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    
    <!-- Status indicators -->
    <circle cx="80" cy="220" r="4" fill="#10b981"/>
    <text x="95" y="225" font-family="Fira Code, monospace" font-size="12" fill="#10b981">Infrastructure Ready</text>
    
    <circle cx="80" cy="250" r="4" fill="#10b981"/>
    <text x="95" y="255" font-family="Fira Code, monospace" font-size="12" fill="#10b981">Services Deployed</text>
    
    <circle cx="80" cy="280" r="4" fill="#10b981"/>
    <text x="95" y="285" font-family="Fira Code, monospace" font-size="12" fill="#10b981">Monitoring Active</text>
    
    <!-- Cursor -->
    <rect x="70" y="310" width="8" height="16" fill="#38bdf8" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <!-- Top left accent -->
  <g opacity="0.3">
    <line x1="30" y1="30" x2="60" y2="30" stroke="#38bdf8" stroke-width="2"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#38bdf8" stroke-width="2"/>
  </g>
  
  <!-- Bottom right accent -->
  <g opacity="0.3">
    <line x1="340" y1="370" x2="370" y2="370" stroke="#10b981" stroke-width="2"/>
    <line x1="370" y1="340" x2="370" y2="370" stroke="#10b981" stroke-width="2"/>
  </g>
</svg>
