<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bannerGradient)"/>
  
  <!-- Grid pattern -->
  <g stroke="rgba(56, 189, 248, 0.1)" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="0" y1="0" x2="0" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="720" y1="0" x2="720" y2="300"/>
    <line x1="840" y1="0" x2="840" y2="300"/>
    <line x1="960" y1="0" x2="960" y2="300"/>
    <line x1="1080" y1="0" x2="1080" y2="300"/>
    <line x1="1200" y1="0" x2="1200" y2="300"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="-0.02em">
    DevOps Tools & Technologies
  </text>
  
  <!-- Tool icons row 1 -->
  <!-- Docker -->
  <g transform="translate(100, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">D</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Docker</text>
  </g>
  
  <!-- Kubernetes -->
  <g transform="translate(250, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">K</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Kubernetes</text>
  </g>
  
  <!-- Terraform -->
  <g transform="translate(400, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">T</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Terraform</text>
  </g>
  
  <!-- Ansible -->
  <g transform="translate(550, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">A</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Ansible</text>
  </g>
  
  <!-- Jenkins -->
  <g transform="translate(700, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">J</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Jenkins</text>
  </g>
  
  <!-- AWS -->
  <g transform="translate(850, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">W</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">AWS</text>
  </g>
  
  <!-- GitHub -->
  <g transform="translate(1000, 120)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" font-family="monospace" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">G</text>
    <text x="0" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">GitHub</text>
  </g>
  
  <!-- Subtitle -->
  <text x="600" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="0.02em">
    Infrastructure Automation • Container Orchestration • CI/CD Pipelines • Cloud Services
  </text>
</svg>
