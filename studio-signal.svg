<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 132" role="img"><title>Community broadcasting signal path</title><desc>Audio from the remote studio reaches listeners through the streaming service.</desc><style>text{font:600 19px system-ui,sans-serif;fill:#edf6fb;text-anchor:middle}.pulse{stroke:#71ddc5;stroke-width:3;stroke-dasharray:6 9;animation:send 1.2s linear 3}@keyframes send{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><rect width="750" height="132" rx="14" fill="#101e2d"/><path d="M200 67H550" stroke="#36566b" stroke-width="3"/><path class="pulse" d="M200 67H550"/><g fill="#173544" stroke="#497486"><rect x="25" y="39" width="180" height="56" rx="8"/><rect x="270" y="39" width="210" height="56" rx="8"/><rect x="545" y="39" width="180" height="56" rx="8"/></g><text x="115" y="74">Remote studio</text><text x="375" y="74">Streaming service</text><text x="635" y="74">Listeners</text></svg>
